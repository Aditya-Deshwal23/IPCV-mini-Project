[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docuvision"
version = "0.1.0"
description = "Classical image processing pipeline for document scanning from video."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy",
    "scipy",
    "scikit-image",
    "matplotlib",
    "pillow",
    "pandas",
    "pytesseract",
    "rapidfuzz",
    "streamlit>=1.35",
    "pytest",
    "fpdf2",
    "ruff>=0.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
